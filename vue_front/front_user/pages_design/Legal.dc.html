<helmet>

<style>
body{margin:0}
a{color:#367F9A}a:hover{color:#294653}
.meng-submit:hover{translate:0 -2px;box-shadow:0 7px 0 #24586C !important}
.meng-submit:active{translate:0 4px;box-shadow:0 1px 0 #24586C !important}
.meng-tab:hover{translate:0 -1px}
.meng-toc-item:hover{background:#DDF1F7 !important}
.meng-submit:focus-visible,.meng-tab:focus-visible,.meng-toc-item:focus-visible,.meng-brand:focus-visible{outline:3px solid #367F9A;outline-offset:2px}
.meng-scroll{scrollbar-width:thin;scrollbar-color:#BCD9E3 transparent}
.meng-scroll::-webkit-scrollbar{width:12px;height:12px}
.meng-scroll::-webkit-scrollbar-thumb{background:#BCD9E3;border-radius:6px;border:3px solid #FFFFFF}
.meng-scroll::-webkit-scrollbar-track{background:transparent}
@keyframes meng-float{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes meng-drift{0%,100%{translate:0 0}50%{translate:20px 0}}
@keyframes meng-twinkle{0%,100%{scale:1;opacity:1}50%{scale:.55;opacity:.45}}
@keyframes meng-spin{to{rotate:360deg}}
@keyframes meng-wave-l{to{translate:-720px 0}}
.meng-motion .mg-float{animation:meng-float 4s ease-in-out infinite}
.meng-motion .mg-drift{animation:meng-drift 12s ease-in-out infinite}
.meng-motion .mg-twinkle{animation:meng-twinkle 2.4s ease-in-out infinite}
.meng-motion .mg-spin{animation:meng-spin 16s linear infinite}
.meng-motion .mg-wave-l{animation:meng-wave-l 26s linear infinite}
.meng-motion .meng-scroll{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){.meng-motion *{animation:none !important}.meng-motion .meng-scroll{scroll-behavior:auto}}
@media (max-width: 760px){
.meng-legal-root{padding:12px !important}
.meng-legal-card{height:calc(100vh - 24px) !important;padding:14px !important;border-radius:28px !important}
.meng-legal-body{flex-direction:column !important}
.meng-legal-toc{flex:none !important;width:auto !important;flex-direction:row !important;overflow-x:auto !important;overflow-y:hidden !important;padding:8px !important;border-radius:20px !important}
.meng-legal-toc .meng-toc-item{flex:none !important;white-space:nowrap}
.meng-legal-only-wide{display:none !important}
.meng-legal-doc{padding:4px 8px 16px 4px !important}
}
</style>
</helmet>

  <svg class="mg-drift" aria-hidden="true" width="380" height="172" viewBox="0 0 420 190" style="position: absolute; right: -120px; top: 42%; animation-duration: 18s"><g fill="#DDF1F7"><circle cx="110" cy="120" r="56"></circle><circle cx="200" cy="88" r="80"></circle><circle cx="300" cy="118" r="60"></circle><rect x="70" y="112" width="280" height="66" rx="33"></rect></g></svg>
  <svg class="mg-float" aria-hidden="true" width="44" height="44" viewBox="0 0 40 40" style="position: absolute; left: 5%; bottom: 30%; animation-duration: 5s"><circle cx="20" cy="20" r="17" fill="#FFFFFF" stroke="#BCD9E3" stroke-width="2"></circle><path d="M11 17a10 10 0 0 1 6-6" fill="none" stroke="#BCD9E3" stroke-width="2" stroke-linecap="round"></path></svg>
  <svg class="mg-float" aria-hidden="true" width="30" height="30" viewBox="0 0 40 40" style="position: absolute; right: 6%; top: 22%; animation-duration: 6s; animation-delay: -2s"><circle cx="20" cy="20" r="17" fill="#FFFFFF" stroke="#BCD9E3" stroke-width="2"></circle></svg>

  <svg class="mg-spin" aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" style="position: absolute; right: 8%; bottom: 20%"><g fill="#F1C3D1"><ellipse cx="12" cy="6.500" rx="3.200" ry="5"></ellipse><ellipse cx="12" cy="6.500" rx="3.200" ry="5" transform="rotate(72 12 12)"></ellipse><ellipse cx="12" cy="6.500" rx="3.200" ry="5" transform="rotate(144 12 12)"></ellipse><ellipse cx="12" cy="6.500" rx="3.200" ry="5" transform="rotate(216 12 12)"></ellipse><ellipse cx="12" cy="6.500" rx="3.200" ry="5" transform="rotate(288 12 12)"></ellipse></g><circle cx="12" cy="12" r="1.800" fill="#F8EDCF"></circle></svg>

  <svg class="mg-wave-l" aria-hidden="true" width="2880" height="200" viewBox="0 0 2880 200" style="position: absolute; left: 0; bottom: 0; max-width: none"><path fill="#DDF1F7" d="M0 50Q180 0 360 50T720 50T1080 50T1440 50T1800 50T2160 50T2520 50T2880 50V200H0z"></path></svg>
  <svg class="mg-wave-l" aria-hidden="true" width="2880" height="140" viewBox="0 0 2880 140" style="position: absolute; left: 0; bottom: 0; max-width: none; animation-duration: 18s; animation-direction: reverse"><path fill="#DDF2E8" d="M0 40Q180 80 360 40T720 40T1080 40T1440 40T1800 40T2160 40T2520 40T2880 40V140H0z"></path></svg>
  <svg class="mg-wave-l" aria-hidden="true" width="2880" height="80" viewBox="0 0 2880 80" style="position: absolute; left: 0; bottom: 0; max-width: none; animation-duration: 14s"><path fill="#FFFFFF" d="M0 30Q180 0 360 30T720 30T1080 30T1440 30T1800 30T2160 30T2520 30T2880 30V80H0z"></path></svg>

  <div class="meng-legal-card" style="position: relative; box-sizing: border-box; width: 100%; max-width: 1120px; height: calc(100vh - 96px); max-height: 820px; padding: 20px; display: flex; flex-direction: column; gap: 16px; border-radius: 40px; background: #FFFFFF; box-shadow: 0 20px 48px rgba(54, 127, 154, 0.16)">

    <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <a class="meng-brand" href="Main.dc.html" aria-label="萌部落，返回登录页" style="flex: none; box-sizing: border-box; height: 48px; padding: 0 16px 0 6px; display: flex; align-items: center; gap: 8px; border-radius: 24px; background: #DDF1F7; text-decoration: none">
        <span style="flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: #367F9A">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M12 3.500c3.200 3.800 5.500 6.800 5.500 9.800a5.500 5.500 0 0 1-11 0c0-3 2.300-6 5.500-9.800z"></path></svg>
        </span>
        <span style="font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; font-size: 22px; line-height: 1.2; color: #294653">萌部落</span>
      </a>

      <div style="flex: none; box-sizing: border-box; height: 48px; padding: 4px; display: flex; align-items: center; gap: 4px; border: 2px solid #DDF1F7; border-radius: 24px; background: #F4FAFC">
        <button class="meng-tab" type="button" onClick="{{showTos}}" style="height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: {{tabTos.bg}}; box-shadow: {{tabTos.shadow}}; font: inherit; font-size: 15px; font-weight: 800; color: {{tabTos.fg}}; cursor: pointer; transition: translate 0.12s">用户协议</button>
        <button class="meng-tab" type="button" onClick="{{showPrivacy}}" style="height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: {{tabPrivacy.bg}}; box-shadow: {{tabPrivacy.shadow}}; font: inherit; font-size: 15px; font-weight: 800; color: {{tabPrivacy.fg}}; cursor: pointer; transition: translate 0.12s">隐私政策</button>
      </div>

      <div style="flex: 1 1 auto"></div>

      <div style="flex: none; height: 32px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border-radius: 16px; background: #F8EDCF; font-size: 13px; font-weight: 700; color: #294653">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.500V12l3 2"></path></svg>
        最后更新 [YYYY-MM-DD]
      </div>
    </div>

    <div class="meng-legal-body" style="flex: 1 1 auto; min-height: 0; display: flex; gap: 16px">

      <nav class="meng-legal-toc meng-scroll" aria-label="章节目录" style="flex: none; box-sizing: border-box; width: 248px; padding: 14px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; border-radius: 28px; background: #F4FAFC">
        <div class="meng-legal-only-wide" style="padding: 2px 10px 8px; font-size: 13px; font-weight: 800; color: #4F6B78">目录</div>
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="6">
          <a class="meng-toc-item" href="{{s.href}}" style="flex: none; box-sizing: border-box; min-height: 44px; padding: 6px 10px; display: flex; align-items: center; gap: 10px; border-radius: 16px; background: {{s.tocBg}}; font-size: 14px; font-weight: {{s.tocWeight}}; color: #294653; text-decoration: none">
            <span style="flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: {{s.badgeBg}}; font-size: 12px; font-weight: 800; color: {{s.badgeFg}}">{{s.no}}</span>
            <span>{{s.title}}</span>
          </a>
        </sc-for>
        <div class="meng-legal-only-wide" style="flex: 1 1 auto; min-height: 12px"></div>
        <div class="meng-legal-only-wide mg-float" style="align-self: center; rotate: -4deg; margin: 6px 0 4px; height: 38px; padding: 0 16px; display: inline-flex; align-items: center; border: 3px solid #FFFFFF; border-radius: 22px; background: #DDF2E8; box-shadow: 0 4px 0 rgba(54, 127, 154, 0.2); font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; font-size: 16px; white-space: nowrap; color: #294653">慢慢看，不着急～</div>
      </nav>

      <div class="meng-legal-doc meng-scroll" onScroll="{{onScroll}}" style="position: relative; flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 8px 20px 24px 12px; overflow-y: auto">

        <div style="display: flex; flex-direction: column; gap: 10px">
          <h1 style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; font-weight: 400; font-size: 38px; line-height: 1.25; color: #294653">
            <span style="display: inline-block; rotate: -2deg; padding: 0 14px; border-radius: 18px; background: {{titleBg}}">{{docTitle}}</span>
            <svg class="mg-twinkle" aria-hidden="true" width="26" height="26" viewBox="0 0 24 24"><path fill="#F0CF7A" d="M12 2c.8 6 4 9.200 10 10-6 .8-9.200 4-10 10-.8-6-4-9.200-10-10 6-.8 9.200-4 10-10z"></path></svg>
          </h1>
          <div style="font-size: 13px; color: #4F6B78">生效日期 [YYYY-MM-DD] · 版本 [v1.0] · 运营者 [运营者名称]</div>
        </div>

        <div style="margin-top: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border-radius: 24px; background: #DDF2E8">
          <div style="display: flex; align-items: center; gap: 8px; font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; font-size: 19px; color: #294653">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E8E6A" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M8.500 14.500a6 6 0 1 1 7 0c-.6.500-1 1.200-1 2H9.500c0-.8-.4-1.500-1-2z"></path></svg>
            三句话看懂
          </div>
          <sc-for list="{{points}}" as="p" hint-placeholder-count="3">
            <div style="display: flex; align-items: flex-start; gap: 10px; font-size: 15px; color: #294653">
              <span style="flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: #FFFFFF; font-size: 13px; font-weight: 800; color: #294653">{{p.no}}</span>
              <span>{{p.text}}</span>
            </div>
          </sc-for>
        </div>

        <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 28px">
          <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
            <section id="{{s.id}}" style="scroll-margin-top: 12px; display: flex; flex-direction: column; gap: 10px">
              <h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 19px; line-height: 1.4; font-weight: 800; color: #294653">
                <span style="flex: none; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 15px; background: #DDF1F7; font-size: 14px; color: #294653">{{s.no}}</span>
                <span>{{s.title}}</span>
              </h2>
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 16px; background: #F8EDCF; font-size: 14px; color: #294653">
                <span style="flex: none; font-weight: 800">简单说</span>
                <span>{{s.brief}}</span>
              </div>
              <p style="margin: 0; font-size: 15px; line-height: 1.85; color: #3D5966">{{s.body}}</p>
            </section>
          </sc-for>
        </div>

        <div style="margin-top: 32px; padding: 14px 18px; border-radius: 20px; background: #F4FAFC; font-size: 14px; color: #3D5966">对这份文件有疑问，可以写信到 [联系邮箱]。</div>
      </div>
    </div>

    <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px">
      <div style="flex: 1 1 200px; max-width: 320px; display: flex; align-items: center; gap: 12px">
        <div style="flex: none; min-width: 64px; font-size: 13px; font-weight: 800; color: #4F6B78">已读 {{progressText}}</div>
        <div style="flex: 1 1 auto; height: 10px; overflow: hidden; border-radius: 5px; background: #DDF1F7">
          <div style="width: {{progressText}}; height: 100%; border-radius: 5px; background: #367F9A; transition: width 0.2s"></div>
        </div>
      </div>
      <a class="meng-submit" href="Register.dc.html" style="flex: none; box-sizing: border-box; height: 48px; margin-bottom: 5px; padding: 0 28px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 24px; background: #367F9A; box-shadow: 0 5px 0 #24586C; font-size: 16px; font-weight: 800; color: #FFFFFF; text-decoration: none; transition: translate 0.12s, box-shadow 0.12s">
        我看完啦
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M12 2c.8 6 4 9.200 10 10-6 .8-9.200 4-10 10-.8-6-4-9.200-10-10 6-.8 9.200-4 10-10z"></path></svg>
      </a>

<script type="text/x-dc" data-dc-script data-props='{"doc":{"editor":"enum","options":["用户协议","隐私政策"],"default":"用户协议","section":"文件"},"motion":{"editor":"boolean","default":true,"section":"动效"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { active: 0, progress: 0 };

  renderVals() {
    const propDoc = this.props.doc ?? '用户协议';
    if (this._propDoc !== propDoc) {
      this._propDoc = propDoc;
      this._localDoc = null;
    }
    const isPrivacy = (this._localDoc ?? propDoc) === '隐私政策';
    const motion = this.props.motion ?? true;
    const st = this.state || {};
    const active = st.active || 0;
    const progress = st.progress || 0;

    const todoBody = '[此处填写正式条款]';
    const todoBrief = '[一句话摘要待填写]';
    const tos = [
      { title: '欢迎与适用范围', brief: '注册并使用萌部落，就表示你同意这份协议。' },
      { title: '账号与审核', brief: '注册后要等管理员审核，通过了才能登录；没通过可以补充理由重新申请。' },
      { title: '社区行为规范', brief: '友善发言，不发违法、骚扰和广告内容。' },
      { title: '你发布的内容', brief: todoBrief },
      { title: '成长、积分与抽奖', brief: todoBrief },
      { title: 'AI 萌萌', brief: '萌萌的回答由 AI 生成，可能出错，仅供参考。' },
      { title: '账号的暂停与终止', brief: todoBrief },
      { title: '协议变更与联系方式', brief: '协议有更新会在站内告诉你；有疑问写信到 [联系邮箱]。' },
    ];
    const privacy = [
      { title: '我们收集什么', brief: '注册只需要用户名、密码，以及邮箱或手机号其中一个；申请理由可以不填。' },
      { title: '我们怎么使用', brief: '用来发验证码、通知审核结果，以及让你登录。' },
      { title: '我们怎么保护', brief: '邮箱和手机号加密存储，密码只存不可还原的哈希，日志里不留明文。' },
      { title: 'Cookie', brief: '只用一个保持登录的 Cookie，网页脚本读不到它。' },
      { title: '第三方服务', brief: '短信和邮件交给服务商发送，和萌萌聊天的内容会交给模型服务商处理。' },
      { title: '你的权利', brief: todoBrief },
      { title: '未成年人', brief: todoBrief },
      { title: '政策更新与联系我们', brief: '政策有更新会在站内告诉你；有疑问写信到 [联系邮箱]。' },
    ];
    const prefix = isPrivacy ? 'privacy-' : 'tos-';
    const sections = (isPrivacy ? privacy : tos).map((s, i) => ({
      no: i + 1,
      id: prefix + (i + 1),
      href: '#' + prefix + (i + 1),
      title: s.title,
      brief: s.brief,
      body: todoBody,
      tocBg: i === active ? '#DDF1F7' : 'transparent',
      tocWeight: i === active ? 800 : 600,
      badgeBg: i === active ? '#367F9A' : '#FFFFFF',
      badgeFg: i === active ? '#FFFFFF' : '#294653',
    }));
    const points = (isPrivacy
      ? ['只收注册必需的信息。', '邮箱和手机号加密存储。', '短信和邮件交给服务商发送。']
      : ['注册要审核，通过了才能登录。', '友善发言，别发违规内容。', '萌萌是 AI，回答仅供参考。']
    ).map((text, i) => ({ no: i + 1, text }));

    const tab = (on) => ({
      bg: on ? '#367F9A' : 'transparent',
      fg: on ? '#FFFFFF' : '#294653',
      shadow: on ? '0 3px 0 #24586C' : 'none',
    });
    const switchTo = (name) => () => {
      this._localDoc = name;
      if (this._scroller) {
        this._scroller.scrollTop = 0;
      }
      this.setState({ active: 0, progress: 0 });
    };

    return {
      rootClass: motion ? 'meng-legal-root meng-motion' : 'meng-legal-root',
      docTitle: isPrivacy ? '隐私政策' : '用户协议',
      titleBg: isPrivacy ? '#F5DDE5' : '#F8EDCF',
      tabTos: tab(!isPrivacy),
      tabPrivacy: tab(isPrivacy),
      showTos: switchTo('用户协议'),
      showPrivacy: switchTo('隐私政策'),
      sections,
      points,
      progressText: Math.round(progress * 100) + '%',
      onScroll: (e) => {
        const el = e.currentTarget;
        this._scroller = el;
        const max = el.scrollHeight - el.clientHeight;
        const nextProgress = max > 0 ? Math.min(1, el.scrollTop / max) : 0;
        let nextActive = 0;
        el.querySelectorAll('section').forEach((sec, i) => {
          if (sec.offsetTop - 80 <= el.scrollTop) {
            nextActive = i;
          }
        });
        if (nextProgress >= 0.995) {
          nextActive = sections.length - 1;
        }
        if (nextActive !== active || Math.abs(nextProgress - progress) >= 0.01) {
          this.setState({ active: nextActive, progress: nextProgress });
        }
      },
    };
  }
}
</script>
</body>
</html>

.meng-back:hover{translate:-2px 0}
.meng-swap svg{transition:rotate .25s}

.meng-swap:focus-visible,.meng-region:focus-visible,.meng-region-item:focus-visible{outline:3px solid #367F9A;outline-offset:-2px}

@keyframes meng-twinkle{0%,100%{scale:1;opacity:1}50%{scale:.55;opacity:.45}}

@keyframes meng-pop{0%{scale:.9;opacity:0}60%{scale:1.04;opacity:1}100%{scale:1}}
@keyframes meng-wave-l{to{translate:-720px 0}}
.meng-motion .mg-float{animation:meng-float 4s ease-in-out infinite}
.meng-motion .mg-drift{animation:meng-drift 12s ease-in-out infinite}
.meng-motion .mg-twinkle{animation:meng-twinkle 2.4s ease-in-out infinite}
.meng-motion .mg-spin{animation:meng-spin 16s linear infinite}
.meng-motion .mg-pop{animation:meng-pop .35s ease-out both}
.meng-motion .mg-wave-l{animation:meng-wave-l 26s linear infinite}
@media (prefers-reduced-motion: reduce){.meng-motion *{animation:none !important}}
</style>

                  </button>
                </div>
              </div>
              <div style="flex: 1 1 160px; min-width: 0">
                <label for="reset-confirm" style="display: block; margin-bottom: 4px; padding-left: 6px; font-size: 14px; font-weight: 700; color: #294653">确认新密码</label>
                <div class="meng-field" style="box-sizing: border-box; height: 52px; padding: 0 16px 0 8px; display: flex; align-items: center; gap: 10px; border: 2px solid {{confirmBorder}}; border-radius: 26px; background: #F4FAFC; transition: box-shadow 0.15s, border-color 0.15s">
                  <div style="flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #DDF1F7">
                    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#367F9A" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path><path d="M9.500 15.500l1.800 1.800 3.200-3.300"></path></svg>
                  </div>
                  <input id="reset-confirm" type="{{pwdType}}" placeholder="再输一次" style="flex: 1 1 auto; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; font: inherit; color: #294653">
                </div>
                <sc-if value="{{pwdMismatch}}" hint-placeholder-val="{{false}}">
                  <div class="mg-pop" style="margin-top: 6px; padding-left: 6px; font-size: 13px; font-weight: 700; color: #A8456A">两次输入的不一样哦</div>
                </sc-if>
              </div>
            </div>

          </div>

          <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px">
            <button class="meng-submit" type="button" onClick="{{submit}}" style="height: 52px; margin-bottom: 5px; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 26px; background: #367F9A; box-shadow: 0 5px 0 #24586C; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; transition: translate 0.12s, box-shadow 0.12s">
              <span style="letter-spacing: 0.15em; margin-right: -0.15em">重置密码</span>
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M12 2c.8 6 4 9.200 10 10-6 .8-9.200 4-10 10-.8-6-4-9.200-10-10 6-.8 9.200-4 10-10z"></path></svg>
            </button>
            <div style="text-align: center; font-size: 14px; color: #4F6B78">想起来了？<a href="Main.dc.html" style="display: inline-block; padding: 8px 4px; font-weight: 800; text-decoration: underline wavy #E9A9BE; text-underline-offset: 5px">去登录</a></div>
          </div>

        </div>
      </sc-if>

      <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
        <div class="mg-pop" style="padding: 4px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
          <div class="mg-float" style="rotate: -3deg; padding: 6px 20px; border-radius: 26px; background: #DDF2E8; box-shadow: 0 5px 0 rgba(54, 127, 154, 0.2); font-size: 24px; font-weight: 800; white-space: nowrap; color: #294653">＼(≧▽≦)／</div>
          <h1 style="margin: 0; font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; font-weight: 400; font-size: 38px; line-height: 1.25; color: #294653">密码改好啦</h1>
          <p style="margin: 0; max-width: 300px; font-size: 15px; color: #4F6B78">其他设备上的登录都已经退出，用新密码重新登录吧。</p>
          <a class="meng-submit" href="Main.dc.html" style="margin-top: 8px; box-sizing: border-box; width: 100%; max-width: 300px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 26px; background: #367F9A; box-shadow: 0 5px 0 #24586C; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none; transition: translate 0.12s, box-shadow 0.12s">去登录</a>
        </div>
      </sc-if>

    </div>

    <div class="mg-float" style="position: absolute; left: -34px; top: 96px; rotate: -8deg; height: 38px; padding: 0 16px; display: inline-flex; align-items: center; border: 3px solid #FFFFFF; border-radius: 22px; background: #F8EDCF; box-shadow: 0 4px 0 rgba(54, 127, 154, 0.2); font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; font-size: 17px; white-space: nowrap; color: #294653; animation-delay: -0.6s">别急～</div>
    <div class="mg-float" style="position: absolute; right: -40px; top: 44%; rotate: 6deg; height: 38px; padding: 0 14px; display: inline-flex; align-items: center; border: 3px solid #FFFFFF; border-radius: 22px; background: #F5DDE5; box-shadow: 0 4px 0 rgba(54, 127, 154, 0.2); font-size: 15px; font-weight: 800; white-space: nowrap; color: #294653; animation-duration: 5s; animation-delay: -2.2s">(｡･ω･｡)ﾉ</div>
    <div class="mg-float" style="position: absolute; left: -28px; bottom: 36px; rotate: 5deg; height: 38px; padding: 0 16px; display: inline-flex; align-items: center; border: 3px solid #FFFFFF; border-radius: 22px; background: #DDF2E8; box-shadow: 0 4px 0 rgba(54, 127, 154, 0.2); font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; font-size: 17px; white-space: nowrap; color: #294653; animation-duration: 4.4s; animation-delay: -1.4s">马上就好</div>
  </div>

  <sc-if value="{{showCaptcha}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 5; box-sizing: border-box; padding: 16px; display: flex; align-items: center; justify-content: center; background: rgba(41, 70, 83, 0.38); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)">
      <div class="mg-pop" style="box-sizing: border-box; width: 100%; max-width: 372px; padding: 20px; display: flex; flex-direction: column; gap: 14px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 60px rgba(41, 70, 83, 0.28)">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column">
            <div style="font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; font-size: 22px; line-height: 1.3; color: #294653">安全验证</div>
            <div style="font-size: 13px; color: #4F6B78">拖动滑块，把拼图拼回去</div>
          </div>
          <button class="meng-eye" type="button" aria-label="关闭" onClick="{{closeCaptcha}}" style="flex: none; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 22px; background: transparent; color: #4F6B78; cursor: pointer">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
          </button>
        </div>
        <div style="position: relative; overflow: hidden; height: 180px; border-radius: 18px; background: #DDF1F7">
          <img src="./assets/a081d3fc017e567cb996faee14f3ae34.png" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 38%; display: block">
          <div style="position: absolute; left: 64%; top: 64px; width: 52px; height: 52px; box-sizing: border-box; border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 12px; background: rgba(41, 70, 83, 0.5)"></div>
          <div style="position: absolute; left: 14px; top: 64px; width: 52px; height: 52px; box-sizing: border-box; border: 2.5px solid #FFFFFF; border-radius: 12px; background: rgba(255, 255, 255, 0.4); box-shadow: 0 4px 12px rgba(41, 70, 83, 0.35)"></div>
        </div>
        <div style="position: relative; box-sizing: border-box; height: 52px; display: flex; align-items: center; justify-content: center; border: 2px solid #BCD9E3; border-radius: 26px; background: #F4FAFC; font-size: 13px; color: #4F6B78">
          <button class="meng-knob" type="button" aria-label="拖动滑块完成验证" onClick="{{passCaptcha}}" style="position: absolute; left: 2px; top: 2px; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 22px; background: #367F9A; box-shadow: 0 3px 0 #24586C; color: #FFFFFF; cursor: pointer; transition: translate 0.12s">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          </button>
          向右拖动滑块
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["填写","滑块验证","验证码已发送","验证码错误","两次密码不一致","重置成功"],"default":"填写","section":"流程状态"},"contact":{"editor":"enum","options":["邮箱","手机号"],"default":"邮箱","section":"联系方式"},"regionOpen":{"editor":"boolean","default":false,"section":"联系方式"},"motion":{"editor":"boolean","default":true,"section":"动效"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { showPwd: false };

  renderVals() {
    const propStep = this.props.step ?? '填写';
    if (this._propStep !== propStep) {
      this._propStep = propStep;
      this._localStep = null;
    }
    const step = this._localStep ?? propStep;
    const go = (next) => () => {
      this._localStep = next;
      this.forceUpdate();
    };
    const propContact = this.props.contact ?? '邮箱';
    if (this._propContact !== propContact) {
      this._propContact = propContact;
      this._localContact = null;
    }
    const byPhone = (this._localContact ?? propContact) === '手机号';
    const propRegionOpen = !!(this.props.regionOpen ?? false);
    if (this._propRegionOpen !== propRegionOpen) {
      this._propRegionOpen = propRegionOpen;
      this._localRegionOpen = null;
    }
    const regionOpen = byPhone && (this._localRegionOpen ?? propRegionOpen);
    const regionCode = this._regionCode ?? '+886';
    const regionList = [
      { name: '台湾', code: '+886' },
      { name: '香港', code: '+852' },
      { name: '澳门', code: '+853' },
      { name: '中国大陆', code: '+86' },
      { name: '日本', code: '+81' },
      { name: '新加坡', code: '+65' },
      { name: '马来西亚', code: '+60' },
      { name: '美国 / 加拿大', code: '+1' },
    ];
    const motion = this.props.motion ?? true;
    const showPwd = !!(this.state || {}).showPwd;
    const done = step === '重置成功';
    const codeSent = step === '验证码已发送';
    const codeWrong = step === '验证码错误';
    const pwdMismatch = step === '两次密码不一致';
    return {
      rootClass: motion ? 'meng-motion' : '',
      byEmail: !byPhone,
      byPhone,
      contactType: byPhone ? 'tel' : 'email',
      contactPlaceholder: byPhone ? '手机号码' : '邮箱地址',
      swapLabel: byPhone ? '改用邮箱找回' : '改用手机号找回',
      toggleContact: () => {
        this._localContact = byPhone ? '邮箱' : '手机号';
        this.forceUpdate();
      },
      regionOpen,
      regionCode,
      regions: regionList.map((r) => ({
        ...r,
        bg: r.code === regionCode ? '#DDF1F7' : 'transparent',
        weight: r.code === regionCode ? 800 : 600,
        pick: () => {
          this._regionCode = r.code;
          this._localRegionOpen = false;
          this.forceUpdate();
        },
      })),
      toggleRegion: () => {
        this._localRegionOpen = !regionOpen;
        this.forceUpdate();
      },
      showForm: !done,
      done,
      showCaptcha: step === '滑块验证',
      codeSent,
      codeIdle: !codeSent,
      codeWrong,
      codeBorder: codeWrong ? '#C4587C' : '#BCD9E3',
      pwdMismatch,
      confirmBorder: pwdMismatch ? '#C4587C' : '#BCD9E3',
      pwdType: showPwd ? 'text' : 'password',
      pwdHidden: !showPwd,
      pwdShown: showPwd,
      pwdToggleLabel: showPwd ? '隐藏密码' : '显示密码',
      togglePwd: () => this.setState({ showPwd: !showPwd }),
      openCaptcha: go('滑块验证'),
      closeCaptcha: go('填写'),
      passCaptcha: go('验证码已发送'),
      submit: go('重置成功'),
    };
  }
}
</script>
</body>
</html>

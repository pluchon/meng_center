server:
  address: 127.0.0.1
  port: 8104
spring:
  cloud:
    nacos:
      discovery:
        ip: 127.0.0.1
    openfeign:
      client:
        config:
          meng-user:
            connectTimeout: 1000
            readTimeout: 2000
  datasource:
    url: jdbc:mysql://127.0.0.1:${MENG_MYSQL_PORT}/meng_im?characterEncoding=utf8&connectionTimeZone=UTC
    username: meng_im_app
    password: ${MENG_MYSQL_IM_PASSWORD}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
meng.im:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173

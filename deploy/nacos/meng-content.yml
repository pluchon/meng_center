server:
  address: 127.0.0.1
  port: 8102
spring:
  cloud:
    nacos:
      discovery:
        ip: 127.0.0.1
  datasource:
    url: jdbc:mysql://127.0.0.1:${MENG_MYSQL_PORT}/meng_content?characterEncoding=utf8&connectionTimeZone=UTC
    username: meng_content_app
    password: ${MENG_MYSQL_CONTENT_PASSWORD}
  flyway:
    locations: classpath:db/migration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
spring.cloud.openfeign.client.config.meng-user:
  connectTimeout: 2000
  readTimeout: 3000
spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 6MB
meng.content:
  image-root: ${MENG_CONTENT_IMAGE_ROOT}
  like-weight: 4
  view-weight: 1
  draft-interval: 3s
  post-interval: 60s
  posts-daily: 20
  uploads-daily: 100
  timezone: Asia/Taipei

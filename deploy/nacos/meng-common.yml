spring:
  data:
    redis:
      host: 127.0.0.1
      port: ${MENG_REDIS_PORT}
      password: ${MENG_REDIS_PASSWORD}
      timeout: 3s
  rabbitmq:
    host: 127.0.0.1
    port: ${MENG_RABBITMQ_PORT}
    username: ${MENG_RABBITMQ_USERNAME}
    password: ${MENG_RABBITMQ_PASSWORD}
    virtual-host: meng
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 指数退避：1s、3s、9s、27s 后再试，约 40 秒内的数据库或下游抖动不会让消息进死信。
        # Boot 4 改用 max-retries（首次之后的重试次数），旧的 max-attempts 已废弃且不生效
        retry:
          enabled: true
          max-retries: 4
          initial-interval: 1s
          multiplier: 3
          max-interval: 30s
        default-requeue-rejected: false
        concurrency: 2
        prefetch: 8
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO

server:
  address: 127.0.0.1
  port: 8080
  # 滑块图片的响应有九十多 KB，压缩后再发给浏览器
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SecureHeaders
          # 下游连不上 2 秒失败，普通接口 30 秒没响应就返回 504，不让卡住的下游一直占着连接；
          # 奶糖一轮和 AI 生成封面本身就慢，单独放宽，WebSocket 长连接不设响应超时
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s
          routes:
            - id: meng-companion
              uri: lb://meng-companion
              predicates:
                - Path=/companion/**
              metadata:
                response-timeout: 130000
            - id: meng-im-websocket
              uri: lb:ws://meng-im
              predicates:
                - Path=/im/ws
              metadata:
                response-timeout: -1
            - id: meng-im
              uri: lb://meng-im
              predicates:
                - Path=/im/**
            - id: meng-user
              uri: lb://meng-user
              predicates:
                - Path=/user/**
            - id: meng-content-ai
              uri: lb://meng-content
              predicates:
                - Path=/content/ai/**
              metadata:
                response-timeout: 130000
            - id: meng-content
              uri: lb://meng-content
              predicates:
                - Path=/content/**
            - id: meng-growth
              uri: lb://meng-growth
              predicates:
                - Path=/growth/**
          discovery:
            locator:
              enabled: false
    nacos:
      discovery:
        ip: 127.0.0.1
meng:
  gateway:
    security:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      session-ttl: 7d
      public-read: []
      whitelist:
        - method: POST
          path: /user/captcha
        - method: POST
          path: /user/captcha/verification
        - method: POST
          path: /user/email-codes
        - method: POST
          path: /user/sms-codes
        - method: POST
          path: /user/registrations
        - method: POST
          path: /user/registrations/reapplication
        - method: POST
          path: /user/sessions
        - method: POST
          path: /user/password-reset-codes
        - method: POST
          path: /user/password-resets

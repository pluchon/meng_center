spring:
  application:
    name: meng-gateway
  config:
    import:
      - nacos:meng-common.yml?group=MENG_GROUP&refreshEnabled=false
      - nacos:meng-gateway.yml?group=MENG_GROUP&refreshEnabled=false
  cloud:
    nacos:
      config:
        server-addr: ${MENG_NACOS_ADDR}
        namespace: ${MENG_NACOS_NAMESPACE}
        username: ${MENG_NACOS_USERNAME}
        password: ${MENG_NACOS_PASSWORD}
        refresh-enabled: false
      discovery:
        server-addr: ${MENG_NACOS_ADDR}
        namespace: ${MENG_NACOS_NAMESPACE}
        username: ${MENG_NACOS_USERNAME}
        password: ${MENG_NACOS_PASSWORD}
        group: MENG_GROUP
